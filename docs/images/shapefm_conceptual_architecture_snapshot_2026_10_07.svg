<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">ShapeFM conceptual architecture snapshot</title>
  <desc id="desc">A point-in-time view of the researcher, research interface, six-gate ShapeFM workflow, shared services, authoritative state, and research outcomes on 7 October 2026.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#40546d"/>
    </marker>
    <style>
      .title { font: 700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172435; }
      .subtitle { font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52667d; }
      .lane-title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172435; }
      .node-title { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172435; }
      .node-text { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #40546d; }
      .gate-number { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .gate-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172435; }
      .gate-text { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #40546d; }
      .service-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172435; }
      .service-text { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #40546d; }
      .note { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #637a96; }
      .arrow { stroke: #40546d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #637a96; stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#fbfcfe"/>
  <text x="800" y="58" text-anchor="middle" class="title">ShapeFM Conceptual Architecture</text>
  <text x="800" y="91" text-anchor="middle" class="subtitle">Point-in-time implementation view · 7 October 2026</text>

  <rect x="28" y="125" width="245" height="690" rx="12" fill="#e9f4fc"/>
  <rect x="303" y="125" width="245" height="690" rx="12" fill="#e8f7f2"/>
  <rect x="578" y="125" width="710" height="690" rx="12" fill="#fff3d8"/>
  <rect x="1318" y="125" width="254" height="690" rx="12" fill="#f0ebff"/>

  <text x="150" y="165" text-anchor="middle" class="lane-title">Research direction</text>
  <text x="425" y="165" text-anchor="middle" class="lane-title">Research interface</text>
  <text x="933" y="165" text-anchor="middle" class="lane-title">Six-gate workflow</text>
  <text x="1445" y="165" text-anchor="middle" class="lane-title">State &amp; outcomes</text>

  <g>
    <rect x="55" y="205" width="190" height="105" rx="6" fill="#cfe8fa"/>
    <text x="150" y="239" text-anchor="middle" class="node-title">Researcher</text>
    <text x="150" y="267" text-anchor="middle" class="node-text">Question, scope</text>
    <text x="150" y="289" text-anchor="middle" class="node-text">and acceptance</text>

    <rect x="55" y="342" width="190" height="105" rx="6" fill="#cfe8fa"/>
    <text x="150" y="376" text-anchor="middle" class="node-title">GIFT-Eval</text>
    <text x="150" y="404" text-anchor="middle" class="node-text">Pinned benchmark</text>
    <text x="150" y="426" text-anchor="middle" class="node-text">datasets</text>

    <rect x="55" y="479" width="190" height="105" rx="6" fill="#cfe8fa"/>
    <text x="150" y="513" text-anchor="middle" class="node-title">Prior evidence</text>
    <text x="150" y="541" text-anchor="middle" class="node-text">Methods and results</text>
    <text x="150" y="563" text-anchor="middle" class="node-text">to reproduce</text>
  </g>

  <g>
    <rect x="330" y="205" width="190" height="105" rx="6" fill="#cceee2"/>
    <text x="425" y="239" text-anchor="middle" class="node-title">00_main.py</text>
    <text x="425" y="267" text-anchor="middle" class="node-text">Single researcher</text>
    <text x="425" y="289" text-anchor="middle" class="node-text">entry point</text>

    <rect x="330" y="342" width="190" height="105" rx="6" fill="#cceee2"/>
    <text x="425" y="376" text-anchor="middle" class="node-title">Experiment JSON</text>
    <text x="425" y="404" text-anchor="middle" class="node-text">Scope, seed, models</text>
    <text x="425" y="426" text-anchor="middle" class="node-text">and controls</text>

    <rect x="330" y="479" width="190" height="105" rx="6" fill="#cceee2"/>
    <text x="425" y="513" text-anchor="middle" class="node-title">Machine inventory</text>
    <text x="425" y="541" text-anchor="middle" class="node-text">Coordinator, workers</text>
    <text x="425" y="563" text-anchor="middle" class="node-text">and capabilities</text>
  </g>

  <path d="M245 394 H320" class="arrow"/>
  <path d="M520 394 H568" class="arrow"/>

  <g>
    <rect x="590" y="215" width="98" height="255" rx="7" fill="#d4eafa"/>
    <circle cx="639" cy="251" r="21" fill="#4f93c8"/>
    <text x="639" y="258" text-anchor="middle" class="gate-number">1</text>
    <text x="639" y="296" text-anchor="middle" class="gate-title">IMPORT</text>
    <text x="639" y="330" text-anchor="middle" class="gate-text">Python</text>
    <text x="639" y="350" text-anchor="middle" class="gate-text">GIFT-Eval</text>
    <line x1="603" y1="382" x2="675" y2="382" stroke="#7aaed2"/>
    <text x="639" y="411" text-anchor="middle" class="gate-text">Canonical</text>
    <text x="639" y="431" text-anchor="middle" class="gate-text">series</text>

    <path d="M688 342 H698" class="arrow"/>

    <rect x="701" y="215" width="98" height="255" rx="7" fill="#fae8b6"/>
    <circle cx="750" cy="251" r="21" fill="#d5a72e"/>
    <text x="750" y="258" text-anchor="middle" class="gate-number">2</text>
    <text x="750" y="296" text-anchor="middle" class="gate-title">CLEAN</text>
    <text x="750" y="330" text-anchor="middle" class="gate-text">Python ↔ R</text>
    <line x1="714" y1="382" x2="786" y2="382" stroke="#d4b45a"/>
    <text x="750" y="411" text-anchor="middle" class="gate-text">Cleaned</text>
    <text x="750" y="431" text-anchor="middle" class="gate-text">series</text>

    <path d="M799 342 H809" class="arrow"/>

    <rect x="812" y="215" width="98" height="255" rx="7" fill="#d7efd9"/>
    <circle cx="861" cy="251" r="21" fill="#5a9d63"/>
    <text x="861" y="258" text-anchor="middle" class="gate-number">3</text>
    <text x="861" y="293" text-anchor="middle" class="gate-title">TRANSFORM</text>
    <text x="861" y="318" text-anchor="middle" class="gate-title">&amp; PREPARE</text>
    <text x="861" y="350" text-anchor="middle" class="gate-text">Windows,</text>
    <text x="861" y="370" text-anchor="middle" class="gate-text">features, labels</text>
    <line x1="825" y1="395" x2="897" y2="395" stroke="#7fb586"/>
    <text x="861" y="424" text-anchor="middle" class="gate-text">Comparable</text>
    <text x="861" y="444" text-anchor="middle" class="gate-text">inputs</text>

    <path d="M910 342 H920" class="arrow"/>

    <rect x="923" y="215" width="98" height="255" rx="7" fill="#f9d7bd"/>
    <circle cx="972" cy="251" r="21" fill="#ce7d40"/>
    <text x="972" y="258" text-anchor="middle" class="gate-number">4</text>
    <text x="972" y="293" text-anchor="middle" class="gate-title">FORECAST</text>
    <text x="972" y="318" text-anchor="middle" class="gate-title">&amp; MODEL</text>
    <text x="972" y="350" text-anchor="middle" class="gate-text">R, Python,</text>
    <text x="972" y="370" text-anchor="middle" class="gate-text">foundations</text>
    <line x1="936" y1="395" x2="1008" y2="395" stroke="#d49a6d"/>
    <text x="972" y="424" text-anchor="middle" class="gate-text">Forecasts &amp;</text>
    <text x="972" y="444" text-anchor="middle" class="gate-text">predictions</text>

    <path d="M1021 342 H1031" class="arrow"/>

    <rect x="1034" y="215" width="98" height="255" rx="7" fill="#e5d8f6"/>
    <circle cx="1083" cy="251" r="21" fill="#8a67b4"/>
    <text x="1083" y="258" text-anchor="middle" class="gate-number">5</text>
    <text x="1083" y="296" text-anchor="middle" class="gate-title">COMBINE</text>
    <text x="1083" y="330" text-anchor="middle" class="gate-text">Stored</text>
    <text x="1083" y="350" text-anchor="middle" class="gate-text">components</text>
    <line x1="1047" y1="382" x2="1119" y2="382" stroke="#a78ac8"/>
    <text x="1083" y="411" text-anchor="middle" class="gate-text">Combined</text>
    <text x="1083" y="431" text-anchor="middle" class="gate-text">results</text>

    <path d="M1132 342 H1142" class="arrow"/>

    <rect x="1145" y="215" width="98" height="255" rx="7" fill="#f4d5d5"/>
    <circle cx="1194" cy="251" r="21" fill="#bd6262"/>
    <text x="1194" y="258" text-anchor="middle" class="gate-number">6</text>
    <text x="1194" y="296" text-anchor="middle" class="gate-title">EVALUATE</text>
    <text x="1194" y="330" text-anchor="middle" class="gate-text">GIFT-Eval</text>
    <text x="1194" y="350" text-anchor="middle" class="gate-text">metrics</text>
    <line x1="1158" y1="382" x2="1230" y2="382" stroke="#cd8585"/>
    <text x="1194" y="411" text-anchor="middle" class="gate-text">Comparable</text>
    <text x="1194" y="431" text-anchor="middle" class="gate-text">evidence</text>
  </g>

  <path d="M1243 342 H1308" class="arrow"/>

  <g>
    <rect x="604" y="518" width="150" height="104" rx="6" fill="#d4eafa"/>
    <text x="679" y="551" text-anchor="middle" class="service-title">Prefect</text>
    <text x="679" y="579" text-anchor="middle" class="service-text">Gate order</text>
    <text x="679" y="600" text-anchor="middle" class="service-text">and recovery</text>

    <rect x="770" y="518" width="150" height="104" rx="6" fill="#d7efd9"/>
    <text x="845" y="551" text-anchor="middle" class="service-title">Dask</text>
    <text x="845" y="579" text-anchor="middle" class="service-text">Distributed</text>
    <text x="845" y="600" text-anchor="middle" class="service-text">tasks</text>

    <rect x="936" y="518" width="150" height="104" rx="6" fill="#fae8b6"/>
    <text x="1011" y="551" text-anchor="middle" class="service-title">DuckDB</text>
    <text x="1011" y="579" text-anchor="middle" class="service-text">Experiment</text>
    <text x="1011" y="600" text-anchor="middle" class="service-text">authority</text>

    <rect x="1102" y="518" width="150" height="104" rx="6" fill="#e5d8f6"/>
    <text x="1177" y="551" text-anchor="middle" class="service-title">ModelStorage</text>
    <text x="1177" y="579" text-anchor="middle" class="service-text">Reusable fitted</text>
    <text x="1177" y="600" text-anchor="middle" class="service-text">meta-learners</text>

    <rect x="604" y="650" width="648" height="102" rx="6" fill="#fffaf0" stroke="#d8c99d"/>
    <text x="928" y="686" text-anchor="middle" class="node-title">Shared operating principle</text>
    <text x="928" y="717" text-anchor="middle" class="node-text">Each gate consumes accepted stored outputs, records its own evidence,</text>
    <text x="928" y="741" text-anchor="middle" class="node-text">and resumes without repeating completed valid work.</text>
  </g>

  <g>
    <rect x="1345" y="205" width="200" height="105" rx="6" fill="#fae8b6"/>
    <text x="1445" y="239" text-anchor="middle" class="node-title">DuckDB experiment</text>
    <text x="1445" y="267" text-anchor="middle" class="node-text">Configuration, tasks,</text>
    <text x="1445" y="289" text-anchor="middle" class="node-text">lineage and results</text>

    <rect x="1345" y="342" width="200" height="105" rx="6" fill="#e5d8f6"/>
    <text x="1445" y="376" text-anchor="middle" class="node-title">Fitted model store</text>
    <text x="1445" y="404" text-anchor="middle" class="node-text">Reusable models</text>
    <text x="1445" y="426" text-anchor="middle" class="node-text">outside DuckDB</text>

    <rect x="1345" y="479" width="200" height="105" rx="6" fill="#f4d5d5"/>
    <text x="1445" y="513" text-anchor="middle" class="node-title">Evaluation evidence</text>
    <text x="1445" y="541" text-anchor="middle" class="node-text">Metrics, comparisons</text>
    <text x="1445" y="563" text-anchor="middle" class="node-text">and fingerprints</text>

    <rect x="1345" y="616" width="200" height="105" rx="6" fill="#cfe8fa"/>
    <text x="1445" y="650" text-anchor="middle" class="node-title">Research decision</text>
    <text x="1445" y="678" text-anchor="middle" class="node-text">Retain, extend,</text>
    <text x="1445" y="700" text-anchor="middle" class="node-text">revise or discard</text>
  </g>

  <path d="M1445 721 V858 H150 V598" class="loop"/>
  <text x="800" y="870" text-anchor="middle" class="subtitle">Evidence drives the next controlled research iteration</text>
  <text x="800" y="904" text-anchor="middle" class="note">Reference snapshot only — not a mandatory standard</text>
</svg>
