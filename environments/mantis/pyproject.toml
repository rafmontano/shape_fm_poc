[project]
name = "shapefm-mantis-environment"
version = "0.1.0"
description = "Isolated Mantis foundation-model inference environment."
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate==1.13.0",
  "huggingface-hub==0.36.2",
  "mantis-tsfm==1.1.0",
  "numpy==2.3.5",
  "torch==2.12.0",
  "transformers==4.57.6",
]

[tool.uv]
required-version = "==0.12.18"
package = false
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
