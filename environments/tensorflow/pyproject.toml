[project]
name = "shapefm-tensorflow-classifiers-environment"
version = "0.1.0"
description = "Isolated TensorFlow and InceptionTime classifier environment."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.0.2",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "sktime==0.40.1",
  "tensorflow==2.18.1 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "tensorflow-metal==1.2.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "tensorflow[and-cuda]==2.21.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
required-version = "==0.12.18"
package = false
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
